<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="心灵宝石">
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6B0"/>
      <stop offset="0.45" stop-color="#F2C94C"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="facet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 金色六边形心灵宝石：原创几何抽象 -->
  <polygon points="50,4 90,27 90,73 50,96 10,73 10,27" fill="url(#stone)" stroke="#8A6508" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="50,4 90,27 50,50 10,27" fill="url(#facet)"/>
  <polygon points="50,50 90,27 90,73 50,96" fill="#E8B923" opacity="0.45"/>
  <polygon points="50,50 10,27 10,73 50,96" fill="#7A5C00" opacity="0.28"/>
  <polyline points="10,27 50,50 90,27" fill="none" stroke="#FFFBE0" stroke-width="1.6" opacity="0.9"/>
  <polyline points="50,4 50,50 50,96" fill="none" stroke="#FFFBE0" stroke-width="1.2" opacity="0.7"/>
  <circle cx="50" cy="50" r="7" fill="#FFFBE0"/>
  <circle cx="50" cy="50" r="3.5" fill="#F2C94C"/>
</svg>
